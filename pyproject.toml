[project]
name = "ssi-investigator"
version = "0.1.0"
description = "SSI: query-driven security investigation reports"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["openai>=1.50", "httpx>=0.27"]
free = ["ddgs>=9,<11"]

[project.scripts]
ssi = "ssi.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ssi*"]
